<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeTube</title>

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Iceland&display=swap" rel="stylesheet">


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #050a07;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: 0.4s ease, visibility 0.4s ease;
        }

        .animation-wrapper {
            display: flex;
            position: relative;
            align-items: center;
            width: 260px;
            height: 60px;
            animation: stageMorph 3.2s cubic-bezier(.25, 1, 0.5, 1) forwards;
        }

        .player-icon {
            height: 24px;
            width: 24px;
            fill: #08c453;
            flex-shrink: 0;
            margin-right: 12px;
            animation: fadeOutIcon 3.2s steps(1)forwards;
        }

        .progress-track {
            position: relative;
            width: 100%;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px;
            overflow: hidden;
            animation: fadeOutTrack 3.2s steps(1)forwards;
        }

        .progress-fill {
            width: 0;
            height: 100%;
            background-color: #08c453;
            box-shadow: 0 0 10px #08c453;
            animation: fillProgressBar 1.8s cubic-bezier(0.4, .6, .4, 1) forwards;
        }

        .brand-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: (-50px, -50px);
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            word-spacing: -1.5px;
            font-size: 50px;
            white-space: nowrap;
            opacity: 0;
            animation: fadeInBrand 3.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes fillProgressBar {
            0% {
                width: 0%;
            }

            30% {
                width: 45%;
            }

            70% {
                width: 85%;
            }

            100% {
                width: 100%;
            }
        }

        @keyframes fadeInBrand {

            0%,
            55% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1);
            }

            68% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.06);
                color: #08c453;
            }

            78%,
            88% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
                color: #ffffff;
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1);
                color: #ffffff;
            }
        }

        @keyframes fadeOutTrack {

            0%,
            55% {
                opacity: 1;
                visibility: visible;
            }

            56%,
            100% {
                opacity: 0;
                visibility: hidden;
            }
        }

        @keyframes fadeOutIcon {

            0%,
            55% {
                opacity: 1;
                transform: scale(1);
            }

            56%,
            100% {
                opacity: 0;
                transform: scale(0);
            }
        }

        @keyframes stageMorph {
            0% {
                opacity: 1;
                transform: scale(.95);
            }

            55% {
                opacity: 1;
                transform: scale(1);
            }

            68% {
                opacity: 1;
                transform: scale(1);
            }

            88% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }

            100% {
                opacity: 0;
                transform: scale(.92) translateY(.92);
            }
        }

        #main-content {
            opacity: 0;
            margin-top: 10vh;
            text-align: center;
            padding: 40px;
            transition: opacity 05s ease-out;
        }

        #main-content.visible {
            opacity: 1;
        }

        #main-content h1 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .account_section {
            display: flex;
            border-radius: 15px;
            justify-content: space-between;
            margin-top: 20vh;
        }

        .account {
            display: flex;
            gap: 25px;
            flex-direction: column;
            font-size: large;
            font-weight: 500;
            padding: 20px;
            border: solid white 1px;
            border-radius: 25px;
            width: 250px;
            margin: 25px;

            .account_picture {
                width: 140px;
                height: 140px;
                margin: 0 auto;
                border-radius: 50px;

            }

            .account:hover {
                transform: scale(1.09);
                transition: 0.5s ease ;
            }
        }

        .intro {
            font-size: large;

            .bold {
                font-weight: 800;
                color: #08c453;
            }
        }
    </style>
</head>

<body>
    <div id="splash-screen">
        <div class="animation-wrapper">
            <svg class="player-icon" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z" />
            </svg>

            <div class="progress-track">
                <div class="progress-fill"></div>
            </div>

            <div class="brand-text">MeTube</div>

        </div>
    </div>

    <main id="main-content">
        <h1>Welcome to <span style="color: #08c453;">Me</span>Tube!</h1>
        <p class="intro">The first personal page inspired from the YT architecture. Let's get started. Select an account
            to discover a new
            <span class="bold">Persona</span>
        </p>

        <div class="account_section">
            <div class="account">
                <img src="" alt="Alan profile" class="account_picture">
                <p>Alan</p>
            </div>

            <div class="account">
                <img src="" alt="The tech dreamer profile" class="account_picture">
                <p>The Tech Dreamer</p>
            </div>

            <div class="account">
                <img src="" alt="X-identity profile" class="account_picture">
                <p>X-identity</p>
            </div>
        </div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const splash = document.getElementById('splash-screen');
            const main = document.getElementById('main-content');

            setTimeout(() => {
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden'

                main.classList.add('visible');

                setTimeout(() => {
                    splash.remove();
                }, 400);
            }, 3200);
        });
    </script>
</body>

</html>
