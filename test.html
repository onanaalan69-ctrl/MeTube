<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyTube Authentic Player Intro</title>

  <!-- Importing a clean, bold Google Font for the branding transition -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Poppins:wght@800&display=swap" rel="stylesheet">

  <style>
    /* Reset the page*/
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      background-color: black;
      color: white;
    }

    #animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      overflow: hidden;
      justify-content: center;
      text-align: center;
      z-index: 9999;
      background-color: black;
      transition: 0.4s ease visibility 0.4s ease;
    }

    .animation_subscreen {
      position: relative;
      align-items: center;
      width: 260px;
      height: 60px;
      animation: stageMorph 3.2s cubic-bezier(0.25, 1, 0.5, 1)forwards;
    }

    .player {
      flex-shrink: 0;
      margin: 12px;
      fill: #00ff66;
      width: 24px;
      height: 24px;
      overflow: hidden;
      animation: fadeOutIcon 3.2s ease steps(1)forwards;
    }

    .progress_bar {
      position: relative;
      width: 100%;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      animation: fadeOutProgress 3.2s ease steps(1)forwards;
    }

    .progress_fill {
      width: 0;
      height: 100%;
      background-color: #00ff66;
      box-shadow: 0 0 10px #00ff66;
      animation: fillProgress ease 1.8s cubic-bezier(0.4, 0.6, 0.4, 1)forwards;
    }

    .MyTube {
      position: absolute;
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      word-spacing: -1.5px;
      white-space: nowrap;
      top: 50%;
      left: 50%;
      font-size: 50px;
      opacity: 0;
      transform: (-50px, -50px);
      animation: fadeInMyTube 3.2s ease cubic-bezier(0.175, 0.885, 0.32, 1.275)forwards;
    }

@keyframes stageMorph {
  0% {opacity: 1; transform: scale(.95);}
  0% {opacity: 1; transform: scale(.95);}
}

    #main-content {
      opacity: 0;
      margin-top: 25vh;
      padding: 40px;
      text-align: center;
      transition: opacity 05s ease-out;
    }

    #main-content.visible {
      opacity: 1;
    }

    #main-content h1 {
      font-size: 36px;
      margin-bottom: 12px;
    }
  </style>
</head>

<body>
  <div id="animation">
    <div class="animation_subscreen">

      <svg class="player" viewBox=" 0 0 24 24">
        <path d="M8 5v14l11-7z">
      </svg>

      <div class="progress_bar">
        <div class="progress_fill"></div>
      </div>

      <div class="MeTube">
        <div>MeTube</div>
      </div>
    </div>

    <main id="main-content">
      <h1>Welcome to MyTube!</h1>
      <p>The green theme player tracking algorithm initialized smoothly.
      </p>
    </main>

    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const splash = document.getElementById('splash-screen');
        const mainContent = document.getElementById('main-content');

        // The loop runs every reload. (To switch persistence back on, uncomment SessionStorage rules)
        setTimeout(() => {
          splash.style.opacity = '0';
          splash.style.visibility = 'hidden';

          mainContent.classList.add('visible');

          setTimeout(() => {
            splash.remove();
          }, 400);

        }, 3200); // 3200ms coordinates cleanly with our CSS sequence lengths
      });
    </script>
</body>

</html>
